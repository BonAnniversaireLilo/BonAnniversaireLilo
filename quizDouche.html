<!doctype html>
<html>

<head>
    <title>for lilo</title>
    <link rel="stylesheet" href="styles.css">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="login-title">
        Quiz
    </div>

    <div class="question-container">

        <div class="question">
            Combien de douches par semaine ?
        </div>

        <div class="correction-container" id="correction" style="display: none;">
            <div class="correction">
                <div class="true" id="true" style="display: none;"></div>
                <div class="false" id="false" style="display: none;"></div>
                De 0 à 5 <br> Vraie gameuse se lave pas
            </div>
            <div class="etoiles">
                <img src="./etoiles.gif" alt="etoiles">
            </div>
        </div>

        <input class="reponse" type="number" id="answer" min="0" max="14" />
        <button class="next-btn" id="valider" type="button" onclick="showCorrectionList(['0', '1', '2', '3', '4', '5'])">Valider</button>

        <button class="next-btn" id="next" style="display: none;" type="button" onclick="nextPage()">
            Suivant
        </button>


    </div>


</body>

<script src="script.js" type="text/javascript">
    let quizContext = JSON.parse(sessionStorage.getItem("quizContext"));
</script>

</html>
