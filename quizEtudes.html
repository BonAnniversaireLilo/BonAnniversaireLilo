<!doctype html>
<html>

<head>
    <title>for lilo</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="login-title">
        Quiz
    </div>

    <div class="question-container">

        <div class="question">
            Elle fait quoi comme études ?
        </div>

        <div class="correction-container" id="correction" style="display: none;">
            <div class="correction">
                <div class="true" id="true" style="display: none;"></div>
                <div class="false" id="false" style="display: none;"></div>
                Ingénieur
            </div>
            <div class="etoiles">
                <img src="./etoiles.gif" alt="etoiles">
            </div>
        </div>

        <div class="QCM-container">
            <button class="QCM-btn" id="qcm-btn1" value="1" type="button" onclick="selectQCM('1')">Ingénieur</button>
            <button class="QCM-btn" id="qcm-btn2" value="2" type="button" onclick="selectQCM('2')">Charpentière</button>
            <button class="QCM-btn" id="qcm-btn3" value="3" type="button" onclick="selectQCM('3')">Sociologie</button>
            <button class="QCM-btn" id="qcm-btn4" value="4" type="button" onclick="selectQCM('4')">Médecine</button>
        </div>

        <button class="next-btn" id="valider" type="button" onclick="answerQCM(['1'])">Valider</button>

        <button class="next-btn" id="next" style="display: none;" type="button" onclick="nextPage()">
            Suivant
        </button>


    </div>


</body>

<script src="script.js" type="text/javascript">
    let quizContext = JSON.parse(sessionStorage.getItem("quizContext"));
</script>

</html>
