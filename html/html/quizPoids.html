                8kg <br> Un beau bébé obèse
            </div>
            <div class="etoiles">
                <img src="../etoiles.gif" alt="etoiles">
            </div>
        </div>

        <!-- <div class="reponse"> -->
        <input class="reponse" type="number" id="answer" min="0" max="220" />
        <button class="next-btn" id="valider" type="button" onclick="showCorrectionList(['8'])">Valider</button>
        <!-- </div> -->

        <button class="next-btn" id="next" style="display: none;" type="button" onclick="nextPage()">
            Suivant
        </button>


    </div>


</body>
