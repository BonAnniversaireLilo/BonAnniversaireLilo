<!doctype html>
<html>

<head>
    <title>for lilo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="login-title">
        Quiz
    </div>

    <div class="question-container">

        <div class="question">
            Quel(s) sport(s) aime-t-elle pratiquer ?
        </div>

        <div class="correction-container" id="correction" style="display: none;">
            <div class="correction">
                <div class="true" id="true" style="display: none;"></div>
                <div class="false" id="false" style="display: none;"></div>
                Escalade, musculation et anciennement Basket
            </div>
            <div class="etoiles">
                <img src="../etoiles.gif" alt="etoiles">
            </div>
        </div>

        <div class="QCM-container">
            <button class="QCM-btn" id="qcm-btn1" value="1" type="button" onclick="selectQCM('1')">Escalade</button>
            <button class="QCM-btn" id="qcm-btn2" value="2" type="button" onclick="selectQCM('2')">Musculation</button>
            <button class="QCM-btn" id="qcm-btn3" value="3" type="button" onclick="selectQCM('3')">Football</button>
            <button class="QCM-btn" id="qcm-btn4" value="4" type="button" onclick="selectQCM('4')">Basketball</button>
        </div>

        <button class="next-btn" id="valider" type="button" onclick="answerQCM(['1', '2', '4'])">Valider</button>

        <button class="next-btn" id="next" style="display: none;" type="button" onclick="nextPage()">
            Suivant
        </button>


    </div>


</body>

<script src="script.js" type="text/javascript">
    let quizContext = JSON.parse(sessionStorage.getItem("quizContext"));
</script>

</html>
